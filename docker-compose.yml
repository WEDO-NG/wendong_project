version: '3.8'

services:
  mysql:
    image: mysql:8.0
    platform: linux/amd64 # Mac M1/M2 兼容性设置
    environment:
      MYSQL_ROOT_PASSWORD: password # 开发环境默认密码
      MYSQL_DATABASE: wendong_project
    ports:
      - "3307:3306" # 修改宿主机端口为 3307，避免与本地 3306 冲突
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck: # 健康检查，确保数据库完全启动后再连接
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:alpine
    ports:
      - "6380:6379" # 修改宿主机端口为 6380，避免与本地 6379 冲突

volumes:
  mysql_data:
